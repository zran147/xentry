  ubuntu-focal-base-image:
    kind: image
    # NOT the release-day build. focal/release-20200423 would align this disk
    # with the dated release pocket, which is what an early serial needs - but
    # it does not boot under scripts/build-images.py: the console shows no
    # initrd= on the kernel command line, so virtio_blk never loads, so the
    # root disk is absent and 5.4.0-26 panics with
    #   VFS: Cannot open root device "PARTUUID=..." or unknown-block(0,0)
    #   available partitions: 0b00 1048575 sr0  driver: sr
    # The only block device the kernel found was the seed CD-ROM.
    #
    # So this stays on a build that boots. The Ubuntu path keeps the mismatch
    # it had - an installed set newer than any early serial can serve - and
    # that is why release.RELEASES now tries DEBIAN FIRST: snapshot.debian.org
    # has the full pocket history and sid is newer than the bullseye base, so
    # apt only ever upgrades.
    provenance: cloud-images.ubuntu.com, digest from the release SHA256SUMS
    sha256: 18f2977d77dfea1b74aee14533bd21c34f789139e949c57023b7364894b7e5e9
    status: resolved
    url: https://cloud-images.ubuntu.com/releases/focal/release-20250624/ubuntu-20.04-server-cloudimg-amd64.img
  ubuntu-jammy-base-image:
    kind: image
    provenance: https://cloud-images.ubuntu.com/releases/jammy/release-20261106/SHA256SUMS
    # Reverted with focal: the release-day pin is the right idea and untested
    # here, because focal's equivalent does not boot and each build is slow.
    # Worth revisiting if an Ubuntu-only CVE needs a dated lab - CVE-2023-4911
    # is the live example, where the guest reported "libc6 is already the
    # newest version (2.35-0ubuntu3.15)" against a plan asking for 2.34, so a
