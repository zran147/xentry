version: 1
# Packages are baked into the images by scripts/build-images.sh. The runtime
# artifact mirror serves only the PHP source, GitLab .deb, kernel .deb, and PoC
# artifacts; it is not an apt repository.
images:
  ubuntu-24.04-target:
    base_artifact: ubuntu-base-image
    packages:
      - apache2
      - apache2-dev
      - autoconf
      - bison
      - build-essential
      - ca-certificates
      - curl
      - git
      - libcurl4-openssl-dev
      - libonig-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - libxml2-dev
      - libzip-dev
      - pkg-config
      - re2c
  ubuntu-24.04-dirtyfrag:
    base_artifact: ubuntu-base-image
    packages:
      - build-essential
      - ca-certificates
      - curl
      - gcc
      - git
      - libc6-dev
      - make
  # The base for every derived target. Deliberately almost empty: the pinned
  # apt mirror installs what a CVE needs at provision time, from a recorded
  # snapshot and a recorded package list, so this image carries only what the
  # harness itself uses - the broker's ssh, curl for the setup step, and the
  # archive keyring apt verifies the snapshot against. Baking anything else in
  # would make a reproduction depend on packages nobody recorded.
  # The base for every derived target, including the ecosystem ones. It stays
  # this thin on purpose: a derived target cannot know what it will install
  # until a CVE is pasted, and an ecosystem target gets its runtime and its
  # dependencies from the job's dated registry mirror. The noble cloud image
  # already supplies what those steps use - xz-utils 5.6.1 to unpack the node
  # tarball, iproute2 6.1.0 for the bind checks, tar, python3 - so nothing has
  # to be added here, and no image has to exist per ecosystem.
  ubuntu-24.04-generic:
    base_artifact: ubuntu-base-image
    packages:
      - ca-certificates
      - curl
      - ubuntu-keyring
  # One per release, because the serial moves along a release's timeline and
  # cannot cross releases: noble never shipped PHP 7.2, so no serial of it can
  # install PHP 7.2. Same three packages in each.
  # Debian, because Ubuntu's archive cannot reach some affected versions at
  # all: CVE-2021-41773 is Apache 2.4.49, which no Ubuntu release ever shipped
  # and which snapshot.debian.org still serves. A current image on purpose -
  # its debian-archive-keyring verifies snapshot Release files back to the
  # bullseye signing key, measured as 2021 onward.
  debian-11-generic:
    base_artifact: debian-11-base-image
    packages:
      - ca-certificates
      - curl
      - debian-archive-keyring
  ubuntu-20.04-generic:
    base_artifact: ubuntu-focal-base-image
    packages:
      - ca-certificates
      - curl
      - ubuntu-keyring
  ubuntu-22.04-generic:
    base_artifact: ubuntu-jammy-base-image
    packages:
      - ca-certificates
      - curl
      - ubuntu-keyring
  ubuntu-18.04-generic:
    base_artifact: ubuntu-bionic-base-image
    packages:
      - ca-certificates
      - curl
      - ubuntu-keyring
  # The application-package target. node comes from a digest-pinned tarball
  # because the archive's nodejs is 18.19 on noble and a current npm advisory
  # wants 20 or later; the vulnerable package itself arrives at provision time
  # as a resolved, digest-verified closure, never from a registry the VM can
  # reach.
  ubuntu-24.04-attacker:
    base_artifact: ubuntu-base-image
    packages:
      - ca-certificates
      - curl
      - git
      - golang-go
      - python3
      - python3-pip
      # A PoC that is C rather than Python has to compile on the attacker, and
      # there is no network there once the job locks: CVE-2021-41773's PoC and
      # most kernel PoCs ship a Makefile and a .c file.
      - build-essential
    # A PoC's own imports, pinned by sha256 and verified by pip itself at build
    # time. The attacker VM has no network once the job locks it, so a PoC
    # whose dependencies are not here fails - CVE-2026-56290's needs colorama.
    # Resolved once on the host with `pip install --dry-run --report`, so this
    # is a full closure and --no-deps is safe. python3-requests left apt: one
    # source for requests, and it is this one.
    wheels:
      # bcrypt 5.0.0
      - url: https://files.pythonhosted.org/packages/d4/8d/5e43d9584b3b3591a6f9b68f755a4da879a59712981ef5ad2a0ac1379f7a/bcrypt-5.0.0-cp39-abi3-manylinux_2_34_x86_64.whl
        sha256: 611f0a17aa4a25a69362dcc299fda5c8a3d4f160e2abb3831041feb77393a14a
      # beautifulsoup4 4.15.0
      - url: https://files.pythonhosted.org/packages/88/c6/92fcd42f1ba33e1184263f25bfabf3d27c383410470f169e4b8163bf9c17/beautifulsoup4-4.15.0-py3-none-any.whl
        sha256: d6f88de62e1d4e38ecb1077eb9724cd0eff29d2a08ca16a401e9b9e93f117cf9
      # certifi 2026.10.23
