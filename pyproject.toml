[project]
name = "xentry"
version = "0.1.0"
description = "Local CVE reproduction with target and attacker VMs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
app = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "google-adk>=1.0",
  "litellm>=1.40",
]
broker = ["asyncssh>=2.14", "pyyaml>=6.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
xentry = "xentry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xentry"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
