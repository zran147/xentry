# dnsmasq for the job bridges: DHCP for the guests, DNS for them and for this
# VM's own mirrors. Installed as /etc/dnsmasq.d/xentry-jobs.conf.
#
# NO interface= DIRECTIVES, and that is the fix for a real failure.
#
# This file once said:
#
#   interface=lo
#   except-interface=lo
#   listen-address=10.43.1.1,10.43.2.1
#
# which cancel out: the only enabled interface was lo, and then lo was
# excluded. dnsmasq reported itself "active" and answered nothing. A capture
# on ens3 showed seven DISCOVERs from the target arriving and going
# unanswered, so the guest booted with no address and every job died at
# create_target or stage_approved.
#
# With no interface directives and bind-dynamic, dnsmasq offers DHCP wherever
# an interface's own address falls inside a dhcp-range - ens3 (10.43.1.1) and
# ens4 (10.43.2.1), never the wan NIC, which has no range. That is the
# property the broken lines were reaching for, and it needs no interface
# NAMES, which have cost three cycles.
#
# LOOPBACK IS INCLUDED, DELIBERATELY. dnsmasq holds 127.0.0.1:53 here, and
# that is wanted: it is the one resolver in this VM with upstreams we chose,
# and /etc/resolv.conf points at it, so the mirrors and the guests resolve
# through the same place. I nearly added except-interface=lo on the theory
# that dnsmasq had taken systemd-resolved's stub address and broken the
# mirrors' resolution. It had not - the sockets show dnsmasq on 127.0.0.1:53
# and resolved still on 127.0.0.53%lo:53, different addresses - and excluding
# lo would have removed the binding resolv.conf depends on.
bind-dynamic

# Upstream is chosen here, not inherited: no-resolv means a resolver this VM
# cannot reach cannot be picked up from elsewhere, and both of these are
# public, so nothing in the host's networks is ever consulted.
domain-needed
bogus-priv
no-resolv
no-hosts
server=1.1.1.1
server=9.9.9.9

# The only DHCP server these bridges will ever have, so answer authoritatively
# rather than waiting out a non-existent competitor.
dhcp-authoritative

# A range per bridge, tagged, so the gateway handed out is the address on THAT
# bridge. Without the tags both ranges would advertise the same router.
dhcp-range=set:target,10.43.1.100,10.43.1.200,12h
dhcp-range=set:attacker,10.43.2.100,10.43.2.200,12h
dhcp-option=tag:target,3,10.43.1.1
dhcp-option=tag:attacker,3,10.43.2.1

# Fixed addresses for the two job MACs, which is what the broker assumes when
# it skips the lease lookup: these are the real MACs from the domain XML, not
# the 52:54:00:00:00:1x placeholders they look like.
dhcp-host=52:54:00:00:00:10,10.43.1.10,target
dhcp-host=52:54:00:00:00:20,10.43.2.20,attacker

# Every DISCOVER, OFFER and ACK in the journal. This is how the missing
# nftables rule was finally found, and it costs nothing.
log-dhcp
